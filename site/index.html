<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ip-catalog</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --panel: #ffffff;
        --text: #172033;
        --muted: #5d6a7f;
        --line: #dbe2ea;
        --accent: #0f766e;
        --accent-soft: #e0f2ef;
        --warn: #9a3412;
        --warn-soft: #ffedd5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .wrap {
        width: min(1440px, calc(100% - 32px));
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 0;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .repo-link {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .lang-toggle {
        display: inline-flex;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
      }

      .lang-toggle button {
        min-height: 32px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--muted);
      }

      .lang-toggle button.active {
        background: var(--accent);
        color: #fff;
      }

      main {
        padding: 20px 0 36px;
      }

      button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
      }

      button {
        padding: 0 12px;
        cursor: pointer;
        font-weight: 600;
      }

      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: white;
      }

      .summary {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 10px 0 14px;
        color: var(--muted);
      }

      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      table {
        width: 100%;
        min-width: 980px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #eef3f8;
        color: #334155;
        font-size: 12px;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      a {
        color: var(--accent);
      }

      .pill {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #115e59;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }

      .pill.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }

      .muted {
        color: var(--muted);
      }

      .empty {
        padding: 32px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        .wrap {
          width: min(100% - 20px, 1440px);
        }

        .topbar,
        .summary {
          align-items: flex-start;
          flex-direction: column;
        }

      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap topbar">
        <h1>ip-catalog</h1>
        <div class="header-actions">
          <div class="lang-toggle" aria-label="Language">
            <button id="langZh" type="button" class="active">中文</button>
            <button id="langEn" type="button">EN</button>
          </div>
          <a class="repo-link" href="https://github.com/openecos-projects/ip-catalog">GitHub</a>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="summary">
        <div id="count"></div>
        <div class="muted" id="dataSource"></div>
      </section>

      <section class="table-wrap" id="tableWrap"></section>
    </main>

    <script>
      const DATA_URL = "generated/index.json";
      const VALUE_LABELS_URL = "i18n/value-labels.json";

      const i18n = {
        zh: {
          loading: "正在加载记录...",
          dataSource: "数据源：",
          records: (total) => `${total} 条记录`,
          empty: "没有匹配的 IP 记录。",
          loadError: "无法加载 catalog 数据。",
          unknown: "未知",
          open: "打开",
          columns: {
            display_name: "名称",
            ip_family: "功能族",
            category: "分类",
            status: "状态",
            maturity: "成熟度",
            interfaces: "接口",
            summary: "摘要",
          },
        },
        en: {
          loading: "Loading records...",
          dataSource: "Data source:",
          records: (total) => `${total} records`,
          empty: "No matching IP records.",
          loadError: "Unable to load catalog data.",
          unknown: "unknown",
          open: "Open",
          columns: {
            display_name: "Name",
            ip_family: "Family",
            category: "Category",
            status: "Status",
            maturity: "Maturity",
            interfaces: "Interfaces",
            summary: "Summary",
          },
        },
      };

      const columns = [
        { key: "display_name" },
        { key: "ip_family" },
        { key: "category" },
        { key: "status" },
        { key: "maturity" },
        { key: "interfaces" },
        { key: "summary" },
      ];

      let records = [];
      let valueLabels = { zh: {}, en: {} };
      let lang = "zh";

      const els = {
        count: document.querySelector("#count"),
        dataSource: document.querySelector("#dataSource"),
        tableWrap: document.querySelector("#tableWrap"),
        langZh: document.querySelector("#langZh"),
        langEn: document.querySelector("#langEn"),
      };

      function t() {
        return i18n[lang];
      }

      function asText(value) {
        if (Array.isArray(value)) return value.join(", ");
        if (value === null || value === undefined || value === "") return t().unknown;
        return String(value);
      }

      function displayValue(record, column) {
        if (column.key === "summary" && lang === "zh" && record.summary_zh) {
          return record.summary_zh;
        }
        const raw = record[column.key];
        const labels = valueLabels[lang]?.[column.key] || {};
        if (Array.isArray(raw)) {
          if (!raw.length) return t().unknown;
          return raw.map((item) => labels[item] || item).join(", ");
        }
        if (raw === null || raw === undefined || raw === "") return t().unknown;
        return labels[raw] || String(raw);
      }

      function cellContent(record, column) {
        const value = record[column.key];
        if (column.key === "uid") {
          const link = document.createElement("a");
          link.href = `../${record.path}`;
          link.textContent = record.uid;
          return link;
        }
        if (column.key === "display_name" && record.catalog_repository) {
          const link = document.createElement("a");
          link.href = record.catalog_repository;
          link.textContent = asText(value);
          return link;
        }
        if (column.key === "status") {
          const span = document.createElement("span");
          span.className = `pill ${asText(value).includes("high") || asText(value).includes("medium") ? "warn" : ""}`;
          span.textContent = displayValue(record, column);
          return span;
        }
        return document.createTextNode(displayValue(record, column));
      }

      function render() {
        els.count.textContent = t().records(records.length);
        els.dataSource.innerHTML = `${t().dataSource} <code>generated/index.json</code>`;
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        els.langZh.classList.toggle("active", lang === "zh");
        els.langEn.classList.toggle("active", lang === "en");

        if (!records.length) {
          els.tableWrap.innerHTML = `<div class="empty">${t().empty}</div>`;
          return;
        }

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");
        columns.forEach((column) => {
          const th = document.createElement("th");
          th.textContent = t().columns[column.key];
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        records.forEach((record) => {
          const row = document.createElement("tr");
          columns.forEach((column) => {
            const td = document.createElement("td");
            td.appendChild(cellContent(record, column));
            row.appendChild(td);
          });
          tbody.appendChild(row);
        });
        table.appendChild(tbody);

        els.tableWrap.innerHTML = "";
        els.tableWrap.appendChild(table);
      }

      async function init() {
        const [dataResponse, labelsResponse] = await Promise.all([
          fetch(DATA_URL, { cache: "no-store" }),
          fetch(VALUE_LABELS_URL, { cache: "no-store" }),
        ]);
        if (!dataResponse.ok) throw new Error(`Failed to load ${DATA_URL}`);
        if (!labelsResponse.ok) throw new Error(`Failed to load ${VALUE_LABELS_URL}`);
        const payload = await dataResponse.json();
        valueLabels = await labelsResponse.json();
        records = payload.records || [];
        els.langZh.addEventListener("click", () => setLanguage("zh"));
        els.langEn.addEventListener("click", () => setLanguage("en"));

        render();
      }

      function setLanguage(nextLang) {
        lang = nextLang;
        render();
      }

      init().catch((error) => {
        els.count.textContent = error.message;
        els.tableWrap.innerHTML = `<div class="empty">${t().loadError}</div>`;
      });
    </script>
  </body>
</html>
