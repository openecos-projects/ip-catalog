<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="OpenECOS open-source chip IP catalog for RISC-V SoC evaluation.">
    <title>OpenECOS IP Catalog</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="catalog.css">
    <link rel="stylesheet" href="overlays.css">
  </head>
  <body>
    <a class="skip-link" href="#catalog">跳到 IP 目录</a>

    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="#" aria-label="OpenECOS IP Catalog 首页">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </span>
          <span>OpenECOS <strong>IP Catalog</strong></span>
        </a>

        <button class="icon-button nav-toggle" id="navToggle" type="button" aria-controls="mainNav" aria-expanded="false">
          <span class="sr-only">打开导航</span>
          <span class="hamburger" aria-hidden="true"></span>
        </button>

        <nav class="main-nav" id="mainNav" aria-label="主导航">
          <a class="active" href="#catalog" data-i18n="navExplore">探索 IP</a>
          <a href="https://github.com/openecos-projects/ip-catalog/blob/main/docs/contribution-guide.md" target="_blank" rel="noreferrer" data-i18n="navContribute">贡献指南</a>
          <a href="https://github.com/openecos-projects/ip-catalog/tree/main/docs" target="_blank" rel="noreferrer" data-i18n="navDocs">项目文档</a>
          <a href="https://github.com/openecos-projects/ip-catalog" target="_blank" rel="noreferrer">GitHub</a>
        </nav>

        <div class="header-actions">
          <div class="lang-toggle" aria-label="Language">
            <button id="langZh" type="button" class="active" aria-pressed="true">中文</button>
            <button id="langEn" type="button" aria-pressed="false">EN</button>
          </div>
          <a class="json-link" href="generated/index.json" download="ip-catalog-index.json">
            <span data-i18n="downloadJson">下载 JSON</span>
          </a>
        </div>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="heroTitle">
        <div class="circuit-lines" aria-hidden="true"></div>
        <div class="shell hero-inner">
          <p class="eyebrow"><span class="live-dot"></span><span data-i18n="eyebrow">开放、可追溯、面向工程评估</span></p>
          <h1 id="heroTitle" data-i18n="heroTitle">开源芯片 IP，随时可供评估</h1>
          <p class="hero-copy" data-i18n="heroCopy">为 RISC-V SoC 工程师汇集来源、成熟度、许可证与集成信息。</p>
          <label class="hero-search" for="searchInput">
            <span class="search-icon" aria-hidden="true"></span>
            <span class="sr-only" data-i18n="searchLabel">搜索 IP</span>
            <input id="searchInput" type="search" autocomplete="off" data-placeholder="searchPlaceholder" placeholder="搜索名称、UID、接口或功能族">
            <kbd>/</kbd>
          </label>

          <dl class="stats" aria-label="目录概览">
            <div>
              <dt data-i18n="statTotal">IP 总数</dt>
              <dd id="statTotal">—</dd>
            </div>
            <div>
              <dt data-i18n="statCategories">分类数</dt>
              <dd id="statCategories">—</dd>
            </div>
            <div>
              <dt data-i18n="statProven">已流片验证</dt>
              <dd id="statProven">—</dd>
            </div>
            <div>
              <dt data-i18n="statCandidate">候选条目</dt>
              <dd id="statCandidate">—</dd>
            </div>
          </dl>
        </div>
      </section>

      <section class="catalog shell" id="catalog" aria-labelledby="catalogTitle">
        <div class="catalog-heading">
          <div>
            <p class="section-kicker" data-i18n="catalogKicker">CATALOG</p>
            <h2 id="catalogTitle" data-i18n="catalogTitle">探索 IP 目录</h2>
          </div>
          <button class="filter-trigger" id="filterTrigger" type="button" aria-controls="filterPanel" aria-expanded="false">
            <span class="filter-symbol" aria-hidden="true"></span>
            <span data-i18n="filters">筛选</span>
            <span class="filter-count" id="mobileFilterCount" hidden>0</span>
          </button>
        </div>

        <div class="catalog-layout">
          <div class="filter-scrim" id="filterScrim"></div>
          <aside class="filters" id="filterPanel" aria-label="筛选 IP">
            <div class="filter-header">
              <div>
                <p class="section-kicker" data-i18n="refine">REFINE</p>
                <h3 data-i18n="filters">筛选</h3>
              </div>
              <button class="text-button" id="clearFilters" type="button" data-i18n="clearAll">全部清除</button>
              <button class="icon-button filter-close" id="filterClose" type="button" aria-label="关闭筛选">×</button>
            </div>
            <div id="filterGroups"></div>
          </aside>

          <div class="results">
            <div class="results-toolbar">
              <div class="result-summary" aria-live="polite">
                <strong id="resultCount">—</strong>
                <span data-i18n="resultUnit">个 IP</span>
              </div>
              <div class="toolbar-actions">
                <div class="sort-control">
                  <label for="sortSelect" data-i18n="sortBy">排序</label>
                  <select id="sortSelect">
                    <option value="display_name" data-i18n="sortName">名称</option>
                    <option value="uid" data-i18n="sortUid">UID</option>
                    <option value="ip_family" data-i18n="sortFamily">功能族</option>
                    <option value="category" data-i18n="sortCategory">分类</option>
                    <option value="status" data-i18n="sortStatus">状态</option>
                    <option value="interfaces" data-i18n="interfaces">接口</option>
                    <option value="maturity" data-i18n="maturity">成熟度</option>
                    <option value="license" data-i18n="license">许可证</option>
                    <option value="license_risk" data-i18n="licenseRisk">许可证风险</option>
                    <option value="integration_difficulty" data-i18n="integrationDifficulty">集成难度</option>
                    <option value="last_reviewed_at" data-i18n="sortReview">最后审核日期</option>
                  </select>
                  <button id="sortDirection" class="icon-button sort-direction" type="button">
                    <span aria-hidden="true">↑</span>
                    <span class="sr-only" data-i18n="ascending">升序</span>
                  </button>
                </div>
                <div class="view-toggle" aria-label="视图">
                  <button id="cardViewButton" class="active" type="button" aria-pressed="true" data-view="cards">
                    <span class="grid-symbol" aria-hidden="true"></span><span data-i18n="cards">卡片</span>
                  </button>
                  <button id="tableViewButton" type="button" aria-pressed="false" data-view="table">
                    <span class="list-symbol" aria-hidden="true"></span><span data-i18n="table">表格</span>
                  </button>
                </div>
              </div>
            </div>
            <div class="active-filters" id="activeFilters" aria-label="已选筛选条件"></div>
            <div class="results-content" id="resultsContent" aria-live="polite">
              <div class="loading-state">
                <span class="loader" aria-hidden="true"></span>
                <p data-i18n="loading">正在加载目录数据…</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="drawer-scrim" id="drawerScrim"></div>
    <aside class="detail-drawer" id="detailDrawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="detailTitle">
      <div class="drawer-header">
        <div>
          <p class="mono" id="detailUid"></p>
          <h2 id="detailTitle"></h2>
        </div>
        <button class="icon-button drawer-close" id="drawerClose" type="button" aria-label="关闭详情">×</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
