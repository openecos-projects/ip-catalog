<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ip-catalog</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --panel: #ffffff;
        --text: #172033;
        --muted: #5d6a7f;
        --line: #dbe2ea;
        --accent: #0f766e;
        --accent-soft: #e0f2ef;
        --warn: #9a3412;
        --warn-soft: #ffedd5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .wrap {
        width: min(1440px, calc(100% - 32px));
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 0;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .repo-link {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }

      main {
        padding: 20px 0 36px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(240px, 1.6fr) repeat(4, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }

      input,
      select,
      button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
      }

      input,
      select {
        width: 100%;
        padding: 0 10px;
      }

      button {
        padding: 0 12px;
        cursor: pointer;
        font-weight: 600;
      }

      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: white;
      }

      .summary {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 10px 0 14px;
        color: var(--muted);
      }

      .columns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }

      .columns label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 30px;
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--muted);
        white-space: nowrap;
      }

      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      table {
        width: 100%;
        min-width: 980px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #eef3f8;
        color: #334155;
        font-size: 12px;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      a {
        color: var(--accent);
      }

      .pill {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #115e59;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }

      .pill.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }

      .muted {
        color: var(--muted);
      }

      .empty {
        padding: 32px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 940px) {
        .toolbar {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 640px) {
        .wrap {
          width: min(100% - 20px, 1440px);
        }

        .topbar,
        .summary {
          align-items: flex-start;
          flex-direction: column;
        }

        .toolbar {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap topbar">
        <h1>ip-catalog</h1>
        <a class="repo-link" href="https://github.com/openecos-projects/ip-catalog">GitHub</a>
      </div>
    </header>

    <main class="wrap">
      <section class="toolbar" aria-label="Filters">
        <input id="search" type="search" placeholder="Search UID, name, family, source, features">
        <select id="category"></select>
        <select id="family"></select>
        <select id="status"></select>
        <select id="licenseRisk"></select>
      </section>

      <section class="summary">
        <div id="count">Loading records...</div>
        <div class="muted">Data source: <code>generated/index.json</code></div>
      </section>

      <section class="columns" id="columns" aria-label="Visible columns"></section>

      <section class="table-wrap" id="tableWrap"></section>
    </main>

    <script>
      const DATA_URL = "../generated/index.json";

      const columns = [
        { key: "uid", label: "UID", required: true },
        { key: "display_name", label: "Name", required: true },
        { key: "ip_family", label: "Family" },
        { key: "category", label: "Category" },
        { key: "status", label: "Status" },
        { key: "license", label: "License" },
        { key: "license_risk", label: "License Risk" },
        { key: "maturity", label: "Maturity" },
        { key: "upstream_owner", label: "Source" },
        { key: "interfaces", label: "Interfaces" },
        { key: "features", label: "Features" },
        { key: "compatibility", label: "Compatibility" },
        { key: "summary", label: "Summary" },
        { key: "next_action", label: "Next Action" },
      ];

      const defaultVisible = new Set([
        "uid",
        "display_name",
        "ip_family",
        "category",
        "status",
        "license",
        "maturity",
        "upstream_owner",
      ]);

      let records = [];
      let visible = new Set(defaultVisible);

      const els = {
        search: document.querySelector("#search"),
        category: document.querySelector("#category"),
        family: document.querySelector("#family"),
        status: document.querySelector("#status"),
        licenseRisk: document.querySelector("#licenseRisk"),
        count: document.querySelector("#count"),
        columns: document.querySelector("#columns"),
        tableWrap: document.querySelector("#tableWrap"),
      };

      function asText(value) {
        if (Array.isArray(value)) return value.join(", ");
        if (value === null || value === undefined || value === "") return "unknown";
        return String(value);
      }

      function optionsFor(key) {
        return [...new Set(records.map((item) => asText(item[key])).filter(Boolean))].sort();
      }

      function fillSelect(select, label, values) {
        select.innerHTML = "";
        const all = document.createElement("option");
        all.value = "";
        all.textContent = `All ${label}`;
        select.appendChild(all);
        values.forEach((value) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          select.appendChild(option);
        });
      }

      function renderColumnControls() {
        els.columns.innerHTML = "";
        columns.forEach((column) => {
          const label = document.createElement("label");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = visible.has(column.key);
          checkbox.disabled = column.required;
          checkbox.addEventListener("change", () => {
            if (checkbox.checked) visible.add(column.key);
            else visible.delete(column.key);
            render();
          });
          label.append(checkbox, document.createTextNode(column.label));
          els.columns.appendChild(label);
        });
      }

      function matches(record) {
        const query = els.search.value.trim().toLowerCase();
        const searchable = [
          record.uid,
          record.display_name,
          record.slug,
          record.ip_family,
          record.category,
          record.upstream_owner,
          record.summary,
          ...(record.features || []),
          ...(record.interfaces || []),
          ...(record.compatibility || []),
        ]
          .join(" ")
          .toLowerCase();

        return (
          (!query || searchable.includes(query)) &&
          (!els.category.value || asText(record.category) === els.category.value) &&
          (!els.family.value || asText(record.ip_family) === els.family.value) &&
          (!els.status.value || asText(record.status) === els.status.value) &&
          (!els.licenseRisk.value || asText(record.license_risk) === els.licenseRisk.value)
        );
      }

      function cellContent(record, column) {
        const value = record[column.key];
        if (column.key === "uid") {
          const link = document.createElement("a");
          link.href = `../${record.path}`;
          link.textContent = record.uid;
          return link;
        }
        if (column.key === "display_name" && record.catalog_repository) {
          const link = document.createElement("a");
          link.href = record.catalog_repository;
          link.textContent = asText(value);
          return link;
        }
        if (column.key === "status" || column.key === "license_risk") {
          const span = document.createElement("span");
          span.className = `pill ${asText(value).includes("high") || asText(value).includes("medium") ? "warn" : ""}`;
          span.textContent = asText(value);
          return span;
        }
        return document.createTextNode(asText(value));
      }

      function render() {
        const filtered = records.filter(matches);
        els.count.textContent = `${filtered.length} of ${records.length} records`;

        if (!filtered.length) {
          els.tableWrap.innerHTML = '<div class="empty">No matching IP records.</div>';
          return;
        }

        const activeColumns = columns.filter((column) => visible.has(column.key));
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");
        activeColumns.forEach((column) => {
          const th = document.createElement("th");
          th.textContent = column.label;
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        filtered.forEach((record) => {
          const row = document.createElement("tr");
          activeColumns.forEach((column) => {
            const td = document.createElement("td");
            td.appendChild(cellContent(record, column));
            row.appendChild(td);
          });
          tbody.appendChild(row);
        });
        table.appendChild(tbody);

        els.tableWrap.innerHTML = "";
        els.tableWrap.appendChild(table);
      }

      async function init() {
        const response = await fetch(DATA_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`Failed to load ${DATA_URL}`);
        const payload = await response.json();
        records = payload.records || [];

        fillSelect(els.category, "categories", optionsFor("category"));
        fillSelect(els.family, "families", optionsFor("ip_family"));
        fillSelect(els.status, "statuses", optionsFor("status"));
        fillSelect(els.licenseRisk, "license risks", optionsFor("license_risk"));
        renderColumnControls();

        [els.search, els.category, els.family, els.status, els.licenseRisk].forEach((el) => {
          el.addEventListener("input", render);
          el.addEventListener("change", render);
        });

        render();
      }

      init().catch((error) => {
        els.count.textContent = error.message;
        els.tableWrap.innerHTML = '<div class="empty">Unable to load catalog data.</div>';
      });
    </script>
  </body>
</html>
