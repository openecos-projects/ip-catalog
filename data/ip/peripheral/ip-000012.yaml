display_name: APB4 PLIC Controller
summary: APB4-based RISC-V PLIC-compatible interrupt controller for one hart target, up to 31 external interrupt sources, priorities, masks, and pending state.
summary_zh: 基于 APB4 总线的 RISC-V PLIC 兼容中断控制器，面向单 hart 目标，支持最多 31 路外部中断、16 级优先级、边沿/电平触发配置、屏蔽位和 pending 状态管理；当前代码来自 20250627 流片工程快照。
