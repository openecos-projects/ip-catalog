display_name: APB4 CRC Controller
summary: APB4-based CRC controller supporting CRC8, CRC16, CRC32 polynomials, byte/bit reversal controls, programmable seed, and XOR output.
summary_zh: 基于 APB4 总线的 CRC 控制器，支持 CRC8、CRC16、CRC32 多项式、输入字节反转、输出位反转、可编程初值和输出异或寄存器，内部基于 LFSR 实现；当前代码来自 20250627 流片工程快照。
