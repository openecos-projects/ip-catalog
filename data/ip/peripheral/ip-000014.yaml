display_name: APB4 RTC Controller
summary: APB4-based real-time counter with programmable prescaler, 32-bit counter and alarm register, write protection, read resynchronization, and three interrupts.
summary_zh: 基于 APB4 总线的实时时钟控制器，支持可在线修改的预分频、32 位向上计数器与闹钟寄存器、写保护、读重同步，以及秒中断、溢出中断和闹钟中断；当前代码来自 20250627 流片工程快照。
