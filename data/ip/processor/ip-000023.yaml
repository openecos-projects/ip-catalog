bus_interfaces:
  - id: m_axi
    name: memory
    kind: memory_mapped
    protocol: AXI
    protocol_version: '4'
    profile: full
    role: initiator
    address_width: 32
    data_width: 32
    required: true
    description: Instruction and data memory interface using an implementation-specific AXI4 subset; instruction fills use four-beat reads and data accesses are single-beat.
prerequisite_dependencies:
  - id: memory_transaction_target
    type: bus_connectivity
    interface_ref: m_axi
    required: true
    requirement:
      capability: transaction_target
      protocol: AXI
      protocol_version: '4'
      profile: full
      connection_modes:
        - native
        - bridge
    description: The processor requires a compatible AXI4 memory target for instruction fetches and data accesses.
provided_capabilities:
  - id: processor_transaction_source
    type: bus_connectivity
    interface_ref: m_axi
    capability:
      name: transaction_source
      protocol: AXI
      protocol_version: '4'
      profile: full
      connection_mode: native
    description: The processor can initiate instruction and data memory transactions.
