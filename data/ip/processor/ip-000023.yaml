summary: Fixed-configuration 32-bit RISC-V processor RTL with a staged integer pipeline, small instruction cache, machine-mode CSR subset, internal timer, and 32-bit AXI-like master interface.
summary_zh: 固定配置的 32 位 RISC-V 处理器 RTL，包含多级整数流水线、小型指令缓存、机器模式 CSR 子集、片内计时器和 32 位 AXI 类主接口。
