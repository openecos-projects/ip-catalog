display_name: Basic SoC Interconnect Bus
summary: Basic SoC interconnect bus supporting 1 to 16 AXI masters, a single AHB master, up to 32 AXI slaves, up to 32 AHB slaves, and up to 31 external APB slaves through an AHB-to-APB bridge.
summary_zh: 基础互联总线，支持 1 到 16 个 AXI Master、单 AHB master、最多 32 个 AXI slaves、32 个 AHB slaves，并通过 AHB-to-APB bridge 支持最多 31 个外部 APB slaves；最大总线宽度 128bits，当前正在开发中。
