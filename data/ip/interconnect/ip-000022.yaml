schema_version: 1
id: ip.axi4_to_apb4_bridge
name: axi4_to_apb4_bridge
version: 1.0.0
uid: ip-000022
repo_name: ip-000022
slug: axi4-to-apb4-bridge
display_name: AXI4 to APB4 Bridge
summary: Parameterized AXI4 subordinate to APB4 manager bridge with burst serialization, wait-state handling, byte strobes, and error propagation.
summary_zh: 参数化 AXI4 从接口到 APB4 主接口桥，将 AXI burst 逐拍转换为 APB 访问，并支持等待状态、字节写选通和错误响应传播。
category: interconnect
subcategories:
  - bus-bridge
  - axi
  - apb
ip_family: bus-bridge
implementation_style: standard-compatible
features:
  - fixed-incr-wrap-bursts
  - apb-wait-states
  - byte-strobes
  - error-propagation
  - parameterized-widths
best_for:
  - soc-control-plane
  - low-bandwidth-peripherals
  - fpga-prototyping
not_recommended_for:
  - high-throughput-multi-outstanding-traffic
  - clock-domain-crossing
bus_interfaces:
  - id: s_axi
    name: upstream
    kind: memory_mapped
    protocol: AXI
    protocol_version: '4'
    profile: full
    role: target
    address_width: 32
    data_width: 32
    required: true
    description: Upstream AXI4 Full interface; widths describe the default parameter configuration.
  - id: m_apb
    name: downstream
    kind: memory_mapped
    protocol: APB
    protocol_version: '4'
    role: initiator
    address_width: 32
    data_width: 32
    required: true
    description: Downstream APB4 interface; widths describe the default parameter configuration.
prerequisite_dependencies:
  - id: upstream_axi_access
    type: bus_connectivity
    interface_ref: s_axi
    required: true
    requirement:
      capability: addressable_bus_access
      protocol: AXI
      protocol_version: '4'
      profile: full
      connection_modes:
        - native
        - bridge
      reachable_from:
        - any_initiator
    description: The AXI4 target must be reachable from a compatible transaction initiator.
provided_capabilities:
  - id: downstream_apb_access
    type: bus_connectivity
    interface_ref: m_apb
    capability:
      name: addressable_bus_access
      protocol: APB
      protocol_version: '4'
      connection_mode: bridge
      reachable_from:
        - upstream_initiator
    description: Provides APB4 access when the required upstream AXI4 path is satisfied.
