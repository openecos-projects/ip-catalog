name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Generate indexes
        run: python scripts/generate-index.py

      - name: Build Pages artifact
        run: |
          mkdir -p _site/generated
          mkdir -p _site/i18n
          cp site/index.html _site/index.html
          cp site/i18n/value-labels.json _site/i18n/value-labels.json
          cp generated/index.json _site/generated/index.json
          cp generated/index.md _site/generated/index.md
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
