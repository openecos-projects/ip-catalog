name: Sync Child IP Metadata

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-child-metadata
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Sync child metadata
        run: python scripts/sync-child-metadata.py

      - name: Generate indexes
        run: python scripts/generate-index.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ip generated
          if git diff --cached --quiet; then
            echo "No child metadata changes."
            exit 0
          fi
          git commit -m "Sync child IP metadata"
          git push
